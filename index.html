<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent: #3182ce;
            --accent-hover: #2b6cb0;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid var(--accent);
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .title {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 28px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: block;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .link-btn:hover {
            background-color: var(--accent-hover);
        }

        .link-btn:active {
            transform: scale(0.98);
        }

        .link-btn.secondary {
            background-color: #edf2f7;
            color: var(--text-main);
        }

        .link-btn.secondary:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Replace with your own image URL -->
        <img class="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=256&h=256" alt="Profile Picture">
        
        <h1 class="name">Jane Doe</h1>
        <p class="title">Software Engineer & Designer</p>
        
        <p class="bio">Building clean, minimalist web experiences. Let's connect or collaborate on your next project!</p>
        
        <div class="links-container">
            <a href="mailto:your.email@example.com" class="link-btn">Email Me</a>
            <a href="https://linkedin.com/in/yourprofile" target="_blank" class="link-btn secondary">LinkedIn</a>
            <a href="https://github.com/yourusername" target="_blank" class="link-btn secondary">GitHub</a>
            <a href="https://yourportfolio.com" target="_blank" class="link-btn secondary">Portfolio Website</a>
        </div>
    </div>

</body>
</html>
